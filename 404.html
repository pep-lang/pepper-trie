<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page not found</title>
<script>
var p = location.pathname, m = p.match(/\/latest(\/|$)/);
if (m) location.replace(p.slice(0, m.index) + "/0.2.0/" + p.slice(m.index + m[0].length) + location.search + location.hash);
</script>
</head>
<body><h1>Page not found</h1></body>
</html>
